name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: cmake -S host -B build-host -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-host --parallel

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build ESP32-S3 firmware with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
      - name: Generate firmware checksums and build manifest
        shell: bash
        run: |
          set -euo pipefail
          # The ESP-IDF container may leave build outputs owned by root.
          # Hand only this generated-artifact directory back to the runner.
          sudo chown -R "$(id -u):$(id -g)" build
          files=(
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/sabir_esp32s3.bin
            build/flash_args
            build/flasher_args.json
          )
          sha256sum "${files[@]}" > build/SHA256SUMS
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "target=esp32s3"
            echo "esp_idf_version=v5.5.5"
            echo "source_date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build/BUILD-MANIFEST.txt
      - name: Package flashable firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sabir-esp32s3-firmware
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/sabir_esp32s3.bin
            build/flash_args
            build/flasher_args.json
            build/SHA256SUMS
            build/BUILD-MANIFEST.txt

  publish-release:
    name: Publish firmware release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: [host-tests, firmware-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sabir-esp32s3-firmware
          path: release-assets
      - name: Publish CI-built firmware bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release-assets/build/sabir_esp32s3.bin
          test -s release-assets/build/bootloader/bootloader.bin
          test -s release-assets/build/partition_table/partition-table.bin
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Sabir ESP32-S3 $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            release-assets/build/sabir_esp32s3.bin \
            release-assets/build/bootloader/bootloader.bin \
            release-assets/build/partition_table/partition-table.bin \
            release-assets/build/flash_args \
            release-assets/build/flasher_args.json \
            release-assets/build/SHA256SUMS \
            release-assets/build/BUILD-MANIFEST.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
