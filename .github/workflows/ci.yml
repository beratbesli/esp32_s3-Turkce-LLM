name: CI

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: cmake -S host -B build-host -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-host --parallel

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware with ESP-IDF 5.5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: .
      - name: Package flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: sabir-esp32s3-firmware
          if-no-files-found: error
          retention-days: 14
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/sabir_esp32s3.bin
            build/flash_args
            build/flasher_args.json
